<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';"
    />
    <title>Hanekawa</title>
    <!--
      Synchronous and first, on purpose: it writes `data-theme` and
      `data-platform` on <html> before the stylesheets below paint anything,
      so a light-theme launch never shows a dark frame (see `themeBoot.ts`).
      Same-origin, which is what the CSP's `script-src 'self'` allows.
    -->
    <script src="./theme-boot.js"></script>
    <!--
      The bundled webfonts (see `fonts.css`): the two faces the first paint
      needs — the sans body and the serif display title — are preloaded so
      their bytes arrive beside the CSS rather than after it. `crossorigin` is
      required even same-origin: fonts are always fetched in CORS mode.
    -->
    <link rel="preload" href="./fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./fonts.css" />
    <!--
      KaTeX's own sheet, copied out of the package by
      `scripts/copy-desktop-assets.mjs` with its `woff`/`ttf` fallbacks stripped
      — only the woff2 are carried, and they land in `./fonts/` beside the
      others, which is where the sheet's relative `url(fonts/…)` already looks.
      Linked rather than folded into `styles.css`: that file is asserted rule by
      rule and admits no `@font-face`.
    -->
    <link rel="stylesheet" href="./katex.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      Two columns: the sidebar owns navigation across every project, and the
      canvas holds the one visible pane. Every pane's transcript lives inside
      `#transcript-area` as its own subtree, visibility-toggled, so switching
      sessions keeps scroll positions and repaints nothing.
    -->
    <!--
      The window's left column: the title bar over the sidebar and the canvas.
      The side panel is its sibling rather than a child of `#shell`, so its card
      runs the window's full height and the title bar stops at its edge.
    -->
    <div id="frame">
    <!--
      The frameless window's own title bar (5g). It is a drag region; the OS
      still paints its window controls into a reserved strip (left on macOS,
      normally right elsewhere), measured through Window Controls Overlay.
    -->
    <header id="titlebar">
      <!--
        Session identity: the title, the `⋯` menu that renames and deletes, and
        "open in editor". It rides in the title bar's blank strip, lined up with
        the canvas's left edge, instead of costing the canvas a row of its own.
      -->
      <div id="canvas-header" hidden></div>
    </header>
    <div id="shell">
      <aside id="sidebar" aria-label="会话与项目"></aside>
      <!--
        The rail's drag handle. A sibling of the two columns rather than a child
        of either: it sits in the gap the canvas's margin already leaves, so
        nothing has to give up width for it, and `#sidebar.collapsed` hides it
        through the adjacent-sibling rule in `styles.css`.
      -->
      <div
        id="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整侧边栏宽度"
        tabindex="0"
      ></div>
      <main id="canvas">
        <div id="transcript-area"></div>
        <!--
          The anchored composite input: one capsule holding the textarea and an
          inline action bar. `#chip-runtime` is a single status label carrying
          the model *and* the effort level; it opens a local popover whose two
          rows fly out into the levels they can take.
        -->
        <form id="input-row">
          <!--
            The composer shares the transcript's reading column, so a message and
            the answer to it sit on one axis. The status line hangs under it
            (5g): usage, cost and "生成中" are metadata about the turn being
            typed, and a strip across the top of the canvas is the one thing the
            reference builds never have.
          -->
          <div class="composer-column">
            <!--
              The panels the composer can raise (S9): the picker / command
              view and the completion list. They used
              to be full-bleed blocks between the transcript and the composer,
              one screen away from the chip that opens them; now they are one
              stack floating on the composer's upper edge, on the same 760px
              axis as the text.
            -->
            <div id="composer-popovers">
              <div id="surface" hidden></div>
              <div id="suggestions" hidden role="listbox" aria-label="补全"></div>
            </div>
            <!-- Running background processes; empty (and not drawn) when there are none. -->
            <div id="process-strip"></div>
            <!--
              The merge reminder (stage 5): a thread canvas's own pending branch,
              or the coordinator's summary of every one. Resident and in the
              flow like the strip above; empty when nothing waits.
            -->
            <div id="merge-bar"></div>
            <div id="composer">
              <!--
                The permission request, drawn inside the capsule instead of over
                the lane: `#composer.request-open` hides the textarea and the
                action bar while it is up, so the input the user's hand is
                already on becomes the thing they answer with. The other three
                blocking requests stay modal — see `dom/permissionRequestView.ts`.
              -->
              <div id="composer-request" hidden></div>
              <!--
                This pane's draft image attachments (S11). In the flow above
                the textarea, like the request card, but it is composer
                content rather than a modal: it rides beside the text draft,
                pane by pane, and `#composer.request-open` hides it together
                with the textarea while a permission request owns the capsule.
                Empty means no rows, not a hidden host — `dom/composerView.ts`
                empties it whenever there is nothing to show.
              -->
              <div id="composer-attachments"></div>
<textarea id="input" spellcheck="false" aria-label="消息" aria-autocomplete="list" aria-controls="suggestions" placeholder="随心输入，/ 调用命令，@ 引用文件" rows="1"></textarea>
              <div id="composer-bar">
                <button id="composer-attach" type="button"></button>
                <!--
                  The permission-mode pill. Its menu is built into this shell by
                  `dom/composerView.ts`, which is why the shell is positioned and
                  the trigger is not.
                -->
                <div id="composer-permission">
                  <button id="chip-permission" type="button">…</button>
                </div>
                <span class="composer-spacer"></span>
                <!--
                  The context indicator and the runtime chip are neighbours, not
                  one control: the gauge reports the live budget while the chip
                  opens the model and effort decisions.
                -->
                <div id="composer-runtime">
                  <div id="composer-context" hidden></div>
                  <!--
                    One status label for both fields. Its menu is built into this
                    shell by `dom/composerView.ts` — same construction as the
                    permission pill, which is why the shell is positioned and the
                    trigger is not.
                  -->
                  <div id="composer-chip">
                    <button id="chip-runtime" type="button">…</button>
                  </div>
                </div>
                <button id="stop" type="button" hidden></button>
                <button id="submit" type="submit"></button>
              </div>
            </div>
            <div id="status">
              <!--
                No 生成中 label: the transcript above already shows a turn
                running, and the strip is for what the session spent; its
                hover carries the cost. It updates per completed request.
              -->
              <span id="status-usage"></span>
            </div>
          </div>
        </form>
        <!--
          The settings screen fills the canvas rather than floating over the
          window: it is a screen, not a dialog, and nothing in the agent loop
          waits on it. `#canvas.settings-open` hides its siblings from the
          stylesheet, so no view has to know about the others.
        -->
        <section id="settings" hidden aria-label="设置"></section>
        <!-- The projects page fills the canvas but, unlike settings, leaves the sidebar up. -->
        <section id="projects" hidden aria-label="项目调度"></section>
        <!--
          The modal layer lives *inside* the canvas (S6): rewind belongs to one
          lane, so it covers that lane's canvas rather than the window. The sidebar
          stays fully usable beneath it. Last child, so DOM order and stacking
          order say the same thing.

          Which is also why it carries no `aria-modal="true"`: that attribute tells
          a screen reader everything outside the dialog is inert, and the sidebar
          is not.
        -->
        <div id="rewind" hidden role="dialog" aria-label="回退">
          <div id="rewind-panel"></div>
        </div>
        <!--
          The toast stack, in the canvas rather than the window: the browser
          panel is a native view beside it, so nothing here can sit under that
          view. After the rewind layer, and above it (z-index 10), so an error
          is never hidden by the dialog that caused it.
        -->
        <div id="toasts"></div>
      </main>
    </div>
    </div>
      <!--
        The browser panel's own drag handle, mirroring `#sidebar-resizer` from
        the other side of the canvas. A sibling of both columns for the same
        reason that one is: it lives in the gap the canvas's margin already
        leaves, so neither column gives up width for it.
      -->
      <div
        id="browser-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整浏览器面板宽度"
        tabindex="0"
        hidden
      ></div>
      <!--
        The side panel. Its browser view ends in a *hole*: an empty element whose
        only job is to be measured, because the page itself is a native
        `WebContentsView` the main process positions over that rect — a native
        view cannot be a node in this document.

        Which is why the hole must stay geometrically honest: no `transform` on
        it or any ancestor (that would change the containing block its rect is
        reported against), and the hole carries no border or padding of its own;
        the card's frame belongs to the panel around it.
      -->
      <aside id="browser-panel" hidden aria-label="侧栏">
        <button type="button" id="side-close" class="side-close" title="关闭侧栏" aria-label="关闭侧栏" hidden>✕</button>
        <div id="browser-view">
          <div id="browser-tabs" role="tablist" aria-label="标签页"></div>
          <div id="browser-address"></div>
          <div id="browser-banner" role="status" hidden></div>
          <div id="browser-hole"></div>
        </div>
        <!-- 改动: every file the session's tools edited. -->
        <div id="changes-view" hidden></div>
        <!-- 线程: a coordination project's head (counts, 全部停止) over its threads. -->
        <div id="threads-page" hidden>
          <div id="overview-head" hidden>
            <h2 class="overview-title">线程</h2>
            <div id="overview-summary-row" class="overview-summary-row"><span id="overview-summary"></span></div>
          </div>
          <div id="thread-view" hidden></div>
          <div id="thread-detail-view" hidden></div>
        </div>
        <!-- 任务: collapsible sections, each shown only while it has content. -->
        <div id="side-sections" hidden>
          <section class="side-section" id="side-section-plan" hidden>
            <button type="button" id="side-section-plan-head" class="side-section-head" aria-expanded="true"></button>
            <div id="side-section-plan-body" class="side-section-body"><div id="plan-view"></div></div>
          </section>
          <section class="side-section" id="side-section-commands" hidden>
            <button type="button" id="side-section-commands-head" class="side-section-head" aria-expanded="true"></button>
            <div id="side-section-commands-body" class="side-section-body"><div id="commands-view"></div></div>
          </section>
          <section class="side-section" id="side-section-subagents" hidden>
            <button type="button" id="side-section-subagents-head" class="side-section-head" aria-expanded="true"></button>
            <div id="side-section-subagents-body" class="side-section-body"><div id="subagent-view"></div></div>
          </section>
          <p id="tasks-empty" hidden>暂无任务</p>
        </div>
      </aside>
    <!--
      The image viewer, outside `#shell` on purpose — the one layer that is not a
      blocking request and the one that *does* cover the window. An image opened
      at full size has nothing to do with a single lane, and a picture cropped to
      the canvas while the sidebar sits lit beside it is not a viewer.

      `aria-modal="true"` is right here for the same reason it was wrong on the
      two layers above: while this is open there is genuinely nothing else to
      interact with, and its own contents are the whole story.
    -->
    <div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="图片预览"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
